<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims ledger</title>
<style>
  :root { --bg:#fff; --fg:#14151a; --muted:#5b6070; --line:#e3e5ea; --card:#f7f8fa; --ok:#1a7f4b; --warn:#a15c00; --bad:#b42318; --none:#5b6070; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f13; --fg:#ecedf1; --muted:#9aa0ae; --line:#272a33; --card:#16181e; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --none:#9aa0ae; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  h2 { margin: 36px 0 12px; font-size: 1.1rem; }
  .muted { color: var(--muted); font-size: .9rem; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin: 16px 0; }
  select, input { font: inherit; padding: 6px 10px; border:1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  .card { border:1px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .quote { margin: 0 0 8px; font-size: 1.02rem; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:.85rem; }
  .badge { border:1px solid currentColor; border-radius: 999px; padding: 1px 10px; font-weight: 600; }
  .holds-up { color: var(--ok); } .on-paper-only { color: var(--warn); } .does-not-hold-up { color: var(--bad); } .cant-be-checked { color: var(--none); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display:flex; width: 160px; }
  .bar span { display:block; height:100%; background: var(--bad); opacity:.85; }
  details { margin-top: 8px; font-size: .88rem; } summary { cursor: pointer; color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; margin-top: 6px; } td, th { text-align:left; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); }
  .change { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; } .appeared { color: var(--ok); } .disappeared { color: var(--bad); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Claims ledger</h1>
  <p class="muted" id="meta"></p>
  <div class="toolbar">
    <select id="owner" aria-label="Owner"><option value="">All owners</option></select>
    <select id="verdict" aria-label="Verdict"><option value="">All verdicts</option></select>
  </div>
  <div id="claims"></div>
  <h2>What changed on the pages</h2>
  <div id="changes"></div>
  <h2>Quotes that failed the word-for-word check</h2>
  <div id="dropped"></div>
</main>
<script src="data.js"></script>
<script>
// Everything is rendered with textContent, never innerHTML: the quotes come from other people's pages.
const data = window.LEDGER;
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
};
const slug = (s) => s.toLowerCase().replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");

function claimCard(claim) {
  const r = claim.receipt;
  const card = el("article", { className: "card" });
  card.append(el("p", { className: "quote" }, `“${claim.text}”`));

  const row = el("div", { className: "row" });
  row.append(el("strong", {}, claim.owner));
  if (r) {
    row.append(el("span", { className: `badge ${slug(r.verdict)}` }, r.verdict));
    const bar = el("span", { className: "bar", title: `Likelihood of a false impression: ${r.score}` });
    for (const value of Object.values(r.score_parts)) bar.append(el("span", { style: `width:${value * 100}%` }));
    row.append(bar, el("span", { className: "muted" }, `likelihood ${r.score} · confidence ${r.confidence}`));
  }
  const link = el("a", { href: claim.source_url, target: "_blank", rel: "noopener noreferrer" }, "source");
  row.append(link);
  card.append(row);

  if (r) {
    card.append(el("p", { className: "muted" }, r.explanation));
    const details = el("details", {}, el("summary", {}, "How this was scored"));
    const table = el("table");
    for (const [name, value] of Object.entries(r.score_parts)) {
      table.append(el("tr", {}, el("td", {}, name.replaceAll("_", " ")), el("td", {}, `${value} of ${data.weights[name] ?? 0}`)));
    }
    details.append(table);
    for (const e of r.evidence) details.append(el("p", {}, `${e.label}: ${e.value} (${e.source})`));
    card.append(details);
  }
  return card;
}

function render() {
  const owner = $("owner").value, verdict = $("verdict").value;
  const shown = data.claims.filter((c) => (!owner || c.owner === owner) && (!verdict || c.receipt?.verdict === verdict));
  $("claims").replaceChildren(...(shown.length ? shown.map(claimCard) : [el("p", { className: "muted" }, "No claims match.")]));
}

for (const o of [...new Set(data.claims.map((c) => c.owner))].sort()) $("owner").append(el("option", { value: o }, o));
for (const v of [...new Set(data.claims.map((c) => c.receipt?.verdict).filter(Boolean))].sort()) $("verdict").append(el("option", { value: v }, v));
$("owner").onchange = $("verdict").onchange = render;

$("meta").textContent = `${data.claims.length} claims verified word for word. ` + (data.last_change ? `A page last changed ${data.last_change}.` : "No page changes recorded yet.");
$("changes").replaceChildren(...(data.changes.length
  ? data.changes.map((c) => el("div", { className: "change" }, el("span", { className: c.change }, c.change), ` · ${c.owner} · ${c.at}`, el("br"), `“${c.text}”`))
  : [el("p", { className: "muted" }, "Nothing has appeared or disappeared since the first run.")]));
$("dropped").replaceChildren(...(data.dropped.length
  ? data.dropped.map((d) => el("div", { className: "change" }, `${d.owner}: “${d.text}”`, el("br"), el("span", { className: "muted" }, d.why)))
  : [el("p", { className: "muted" }, "None.")]));
render();
</script>
</body>
</html>

# Re-fetches every source on a schedule, re-checks each quote word for word,
# re-scores, rebuilds the viewer data, and commits ONLY if something changed.
# The git history then doubles as a record of when a claim appeared, changed or
# disappeared.
#
# GitHub only reads workflows from the repository root. If this folder is a
# subfolder of a larger repo, move this file to <root>/.github/workflows/ and
# add `working-directory: claims-ledger` to the steps.
name: Refresh claims ledger
on:
  schedule:
    - cron: "17 */6 * * *" # every six hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, verify, score, bundle
        env:
          LEDGER_CONTACT: ${{ secrets.LEDGER_CONTACT }} # "Your Name you@example.com", sent in the User-Agent
        run: python -m ledger all
      - name: Commit if anything changed
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add data/out site/data.js
          git diff --cached --quiet || git commit -m "Refresh claims ledger"
          git push

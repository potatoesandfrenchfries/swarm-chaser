# Frozen prompt hashes (MVP.md M13; battery config.yaml freeze pattern, MIT). TOML so src/ reads
# it with the stdlib (src/ is stdlib-only: tests/test_pipeline_contract.py).
#
# One entry per frozen prompt, added by the prompt's owner when they freeze it:
#   key   = "<module>:<ATTRIBUTE>", a string constant importable from src/
#   value = its sha256; `uv run python src/freeze.py <module>:<ATTRIBUTE>` prints the line to add
#
# tests/test_freeze.py fails if a registered prompt's text changes without its hash. Changing a
# frozen prompt means a new variant name (pipeline-rules), not an edited hash.

[prompts]
"spread.linker:RELATION_PROMPT" = "2690f0ab9061aa0519a85f7969f071250bd5dfa1c9ede71d74ad305c0a5cc35d"
"eval.decision_curve:SCORE_PROMPT" = "a4268b488ebfab4db0c93edcb7795f844072ad57d0be8a7c85df206c85b18568"
"eval.validation:FINDING_TAG_PROMPT" = "eb05c93041f7ef799b335fe481a115f8c18335173c569a6bceec9bc187a2c51c"
"check.checker:CHECKER_PROMPT" = "5e81a1a009e43b971a6cf02c56034ab78fbaa3e47af95a17df56b87137769820"
"extract.claims:CLAIM_PROMPT" = "01d34c1ceb0792d0fe84aa4d2ae79b390d8be4283717cdf2709efe20a4eaa9da"
"extract.claims:CLAIM_PROMPT_E2" = "31f7d6e925afddc6f356d636f39e083f3d065da0e3c59afa9de0f8fc3960380d"
"lab.supervisor:SUPERVISOR_PROMPT" = "7cde04ee920869364e223a9ad98ac5f21d97c7a79c0ced322055c242a732b200"

# One budget for every paid call (issue #19): three pounds. src/llm/budget.py turns it into dollars and
# subtracts what the cache says is already spent. usd_per_gbp is an ASSUMED rate, kept a little low so the
# dollar cap errs on the side of less; check it against today's rate before relying on the margin.
[spend]
cap_gbp = 3.0
usd_per_gbp = 1.25

# The extraction model (MVP.md M3) and the two checker models (M4, from different vendors). For API calls,
# `vendor` selects the transport in adapters/vendors.py; `model` is that vendor's id; prices are USD per
# million tokens, needed for the spend cap. Read by src/extract/run.py and src/check/run.py, which send no
# temperature unless one is set here: Claude Haiku 5.5 rejects non-default sampling values, and the Claude API
# rejects sampling parameters from 2026-10-21. max_tokens covers the model's thinking as well as its JSON
# answer, because both models think by default. A cache entry is keyed on these settings, so changing one
# reruns that model's calls.
#
# Prices, checked 2026-10-24: Claude Haiku 5.5 is $0.10 in / $0.50 out for prompts up to 100K tokens ($0.50 /
# $2.50 above that; our windows and chunks are far smaller). Checker B is gpt-oss-120b through OpenRouter,
# $0.15 in / $0.60 out (openrouter.ai/api/v1/models, read 2026-10-24); it reasons, and OpenRouter reports that as
# completion tokens. It replaced Gemini 3.8 Flash ($0.75 / $3.75), which put the 649-claim check sample at about
# $21 of a $3.75 budget, and Groq's gpt-oss-120b, whose free tier allows 8,000 tokens a minute against windows of
# about 15,000. On 60 claims its kappa with Haiku was 0.50, against 0.33 for gpt-oss-20b (STRESSTEST.md).

[extractor]
vendor = "anthropic"
model = "claude-haiku-5-5"
max_tokens = 16000  # 8000 cut 3 of 10 prompt-e2 replies off mid-JSON: thinking took most of it (mean 5.3k output tokens)
usd_per_mtok_in = 0.10
usd_per_mtok_out = 0.50

[checkers.a]
vendor = "anthropic"
model = "claude-haiku-5-5"
max_tokens = 8000
usd_per_mtok_in = 0.10
usd_per_mtok_out = 0.50

# Models that were used and then replaced. Their answers are still in the cache and were paid for, so the budget
# keeps counting them (src/llm/budget.py). Remove an entry only if the cache is cleared of its answers.
[retired.gemini_3_8_flash]
vendor = "gemini"
model = "gemini-3.8-flash"
usd_per_mtok_in = 0.75
usd_per_mtok_out = 3.75

[retired.gpt_oss_20b_openrouter]
vendor = "openrouter"
model = "openai/gpt-oss-20b"
usd_per_mtok_in = 0.018
usd_per_mtok_out = 0.09

[checkers.b]
vendor = "openrouter"
model = "openai/gpt-oss-120b"
max_tokens = 16000
usd_per_mtok_in = 0.15
usd_per_mtok_out = 0.60

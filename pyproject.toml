[project]
name = "claim-spread"
version = "0.1.0"
description = "Do false claims spread through the AI Village, and what stops them?"
requires-python = ">=3.11,<3.14"
dependencies = [
    # LLM calls (extraction, checker, judge, forecaster, influencer)
    "anthropic",
    "openai",            # also used for OpenRouter via base_url
    "google-genai",      # Gemini extraction model
    "tenacity",          # retries around model calls
    "httpx",

    # Sandbox (M9 to M11): needs Docker running
    "inspect-ai",

    # Data access and config
    "huggingface-hub",   # AI Village dataset download
    "datasets",
    "pyyaml",
    "python-dotenv",
    "pydantic",

    # Analysis and stats (Wilson intervals, kappa, Brier, AUC, decision curve)
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",

    # Spread linking baselines and text matching
    "rapidfuzz",

    # Results page and plots
    "matplotlib",
    "jinja2",
    "tqdm",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",        # property tests for the stats and chunking code
    "ruff",
    "ipykernel",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness only: pyflakes, pycodestyle, import order, bugbear. Style rewrites (pyupgrade,
# simplify) are left out so CI does not fail on code that is merely old-fashioned.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # line length is the formatter's job
    "B905",  # zip(strict=) would change behaviour in eval/validation.py; revisit with the kappa fix
]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "check", "eval", "extract", "ingest", "lab", "llm", "report", "spread"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
